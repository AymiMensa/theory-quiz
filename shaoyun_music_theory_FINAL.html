<!doctype html>
<html lang="zh-Hant" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>韶韻音樂學院 馬老師 專為 秀玲設計 樂理亂數題庫</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color-scheme:light;--bg:#f5f6fa;--panel:#fff;--text:#202331;--muted:#596176;--border:#d9deea;--control:#fff;--soft:#eef0f7;--accent:#273b80;--badbg:#fff4f3;--goodbg:#f1fff2}html[data-theme="dark"]{color-scheme:dark;--bg:#11151d;--panel:#1b2230;--text:#e8ecf5;--muted:#b1bacb;--border:#394356;--control:#252e3d;--soft:#293448;--accent:#8da8ff;--badbg:#3a2228;--goodbg:#1d3529}*{box-sizing:border-box}body{max-width:1050px;margin:24px auto;padding:0 16px 40px;color:var(--text);background:var(--bg)}.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin:14px 0}.controls,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,input,button{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--control);color:var(--text)}button{background:var(--accent);color:white;cursor:pointer;border-color:var(--accent)}button.secondary{background:var(--control);color:var(--text)}button:disabled{opacity:.55;cursor:not-allowed}.question{padding:13px;margin:9px 0;border:1px solid var(--border);border-radius:9px;display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,380px);gap:10px;align-items:center}.wrong{border:2px solid #c44747;background:var(--badbg)}.correct{border-color:#39854a;background:var(--goodbg)}.hint,.feedback{color:var(--muted);font-size:.9em}.stats{display:flex;gap:9px;flex-wrap:wrap}.stats span{background:var(--soft);border-radius:7px;padding:8px}.review-item{padding:10px 0;border-top:1px solid var(--border)}.good{color:#328744}.bad{color:#ce4545}.entry{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.entry select{padding:6px}.paper-page{background:#fff;color:#172033;font-family:system-ui,"Noto Sans TC",sans-serif;padding:44px 52px;width:100%;height:auto;min-height:0;overflow:visible}.paper-page h1{font-size:30px;line-height:1.3;margin:0 0 8px}.paper-meta{font-size:15px;color:#4b5563;border-bottom:2px solid #1f2937;padding:10px 0 15px;margin-bottom:18px}.paper-q{font-size:17px;line-height:1.5;padding:11px 3px;border-bottom:1px solid #cbd5e1;break-inside:avoid;page-break-inside:avoid}.paper-q .line{height:27px;border-bottom:1px dotted #94a3b8;margin-top:5px}.paper-footer{margin-top:20px;padding-top:9px;border-top:1px solid #cbd5e1;color:#64748b;font-size:13px}#printArea{position:fixed;left:-30000px;top:0;width:900px;background:#fff;z-index:-1}@media(max-width:700px){.question{grid-template-columns:1fr}}@media print{@page{size:auto;margin:12mm}body{margin:0;max-width:none;padding:0;background:white}body>*:not(#printArea){display:none!important}#printArea{position:static;left:auto;top:auto;width:auto;display:block!important;z-index:auto}#printArea .paper-page{width:auto;padding:0}.paper-q{font-size:12pt;padding:7px 2px}.paper-q .line{height:22px}}/* iframe embed: fill full width */html,body{height:auto;overflow-x:hidden}@media(max-width:1080px){body{max-width:100%;margin:12px auto}}
</style></head><body>
<h1 id="title">韶韻音樂學院 馬老師 專為 秀玲設計 樂理亂數題庫</h1><p class="hint">題目不顯示調名。請用音名字母與升降記號選單作答；和弦按題目指定順序輸入。</p>
<section class="panel"><div class="controls"><label>試卷 <select id="paper"><option value="degree">調內音級</option><option value="chromatic">半音階音級</option><option value="chord">和弦辨認</option><option value="inversion">和弦轉位</option></select></label><label id="chromWrap" hidden>半音階拼法 <select id="chrom"><option value="random">隨機升／降拼法</option><option value="sharp">升記號拼法</option><option value="flat">降記號拼法</option></select></label><label id="ctypeWrap" hidden>和弦種類 <select id="ctype"><option value="major">大三和弦</option><option value="minor">小三和弦</option><option value="aug">增三和弦</option><option value="dim">減三和弦</option><option value="dom7">屬七和弦</option><option value="maj7">大七和弦</option><option value="min7">小七和弦</option><option value="hdim7">半減七和弦</option><option value="dim7">減七和弦</option><option value="random">隨機混合</option></select></label><label>題數 <input id="count" type="number" min="1" max="100" value="10" style="width:82px"></label><label>種子 <input id="seedVal" type="number" placeholder="隨機" style="width:108px" min="0"></label><span style="color:#c00;font-weight:700;text-decoration:underline;font-size:0.88em;white-space:nowrap">※重現試卷須三者一致：種子＋題型＋題數</span><button id="new">產生試卷</button><button id="submit" disabled>交卷／檢查答案</button><button id="theme" class="secondary" type="button">切換深色系</button><button id="printBtn" class="secondary" type="button">列印試卷</button><button id="imageBtn" class="secondary" type="button">輸出圖片（直式 3:4）</button><span style="display:flex;align-items:center;gap:4px;flex-wrap:nowrap">日期：<input id="dateY" type="text" placeholder="年" style="width:52px;padding:6px 6px">年<input id="dateM" type="text" placeholder="月" style="width:38px;padding:6px 4px">月<input id="dateD" type="text" placeholder="日" style="width:38px;padding:6px 4px">日</span><span style="color:#c00;font-weight:700;text-decoration:underline;white-space:nowrap;font-size:0.95em">※請勿使用ChatGPT作答！</span></div></section>
<section class="panel"><h2>分數統計</h2><div id="stats" class="stats"></div><div id="result"></div></section><section class="panel"><div class="row" style="justify-content:space-between"><h2>題目</h2><div id="seedDisplay" style="display:none;background:var(--soft);border:1.5px solid var(--border);border-radius:8px;padding:7px 14px;font-size:0.92em;line-height:1.6"></div></div><div id="questions"></div></section><section class="panel"><div class="row"><h2>錯題本</h2><button id="clear" class="secondary">清除錯題本</button></div><div id="review"></div></section><div id="printArea" hidden></div>
<script>
'use strict';
const LETTERS=['C','D','E','F','G','A','B'];
const NATURAL={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const SCALE_STEPS=[0,2,4,5,7,9,11];
const DEGREE=['主音','上主音','中音','下屬音','屬音','下中音','導音'];
const KEYS=[['C','C',0],['G','G',7],['D','D',2],['A','A',9],['E','E',4],['B','B',11],['F#','F',6],['F','F',5],['Bb','B',10],['Eb','E',3],['Ab','A',8],['Db','D',1],['Gb','G',6]].map(([name,letter,pc])=>({name,letter,pc}));
const CHORDS={major:{name:'大三和弦',intervals:[0,4,7],letters:[0,2,4]},minor:{name:'小三和弦',intervals:[0,3,7],letters:[0,2,4]},aug:{name:'增三和弦',intervals:[0,4,8],letters:[0,2,4]},dim:{name:'減三和弦',intervals:[0,3,6],letters:[0,2,4]},dom7:{name:'屬七和弦',intervals:[0,4,7,10],letters:[0,2,4,6]},maj7:{name:'大七和弦',intervals:[0,4,7,11],letters:[0,2,4,6]},min7:{name:'小七和弦',intervals:[0,3,7,10],letters:[0,2,4,6]},hdim7:{name:'半減七和弦',intervals:[0,3,6,10],letters:[0,2,4,6]},dim7:{name:'減七和弦',intervals:[0,3,6,9],letters:[0,2,4,6]}};
const $=id=>document.getElementById(id),mod=n=>(n%12+12)%12,pick=a=>a[Math.floor(rng()*a.length)];
function mulberry32(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}let rng=()=>Math.random(),currentSeed=null;let questions=[],statsData={first:0,done:0,wrong:0},wrongBook=[];try{wrongBook=JSON.parse(localStorage.getItem('theoryWrongBook')||'[]')}catch{}
function spell(letter,pitch){let d=mod(pitch-NATURAL[letter]),acc;if(d<=2)acc='#'.repeat(d);else if(d>=10)acc='b'.repeat(12-d);else throw Error(`Internal spelling error: ${letter} pitch ${pitch}`);return{letter,acc,pc:mod(pitch),name:letter+acc}}
function majorScale(key){let ix=LETTERS.indexOf(key.letter);return SCALE_STEPS.map((step,i)=>spell(LETTERS[(ix+i)%7],key.pc+step))}
function buildChord(root,type){let c=CHORDS[type],ix=LETTERS.indexOf(root.letter);return c.intervals.map((it,i)=>spell(LETTERS[(ix+c.letters[i])%7],root.pc+it))}
function parseNote(text){let m=String(text).match(/^([A-G])((?:#{1,2}|b{1,2})?)$/);if(!m)return null;let adjustment=(m[2].match(/#/g)||[]).length-(m[2].match(/b/g)||[]).length;return{pc:mod(NATURAL[m[1]]+adjustment),name:m[1]+m[2]}}
function sameNotes(given,answer){return given.length===answer.length&&answer.every((n,i)=>given[i]&&given[i].pc===n.pc)}
function findKeyByDegree(note,degree){return KEYS.find(k=>majorScale(k)[degree].name===note.name)||null}
function makeDegreeQuestion(){let sourceKey=pick(KEYS),sourceDegree=Math.floor(rng()*7),given=majorScale(sourceKey)[sourceDegree],targetDegree=Math.floor(rng()*7),resolvedKey=findKeyByDegree(given,sourceDegree);if(!resolvedKey)throw Error('無法由已知音級與音名反推調性');let answer=majorScale(resolvedKey)[targetDegree];return{kind:'degree',answer:[answer],question:`已知某調的${DEGREE[sourceDegree]}為 ${given.name}，求該調${DEGREE[targetDegree]}為 ____。（用音名表示）`}}
function chromaticNotes(key,mode){let scale=majorScale(key),out=[];for(let i=0;i<7;i++){out.push(scale[i]);let next=scale[(i+1)%7],distance=mod(next.pc-scale[i].pc);if(distance===2){let pitch=mod(scale[i].pc+1),sharpNames=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],flatNames=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];out.push(parseNote((mode==='flat'?flatNames:sharpNames)[pitch]))}}return out}
function makeChromaticQuestion(){let mode=$('chrom').value;if(mode==='random')mode=pick(['sharp','flat']);let givenDegree=Math.floor(rng()*7),sourceKey=pick(KEYS),givenNote=majorScale(sourceKey)[givenDegree],resolvedKey=findKeyByDegree(givenNote,givenDegree);if(!resolvedKey)throw Error('無法由已知音級反推調性');let notes=chromaticNotes(resolvedKey,mode),idx=Math.floor(rng()*notes.length);return{kind:'chromatic',answer:[notes[idx]],question:`已知某調的${DEGREE[givenDegree]}為 ${givenNote.name}，求該調半音階第 ${idx+1} 音為 ____。（用音名表示）`}}
function makeChordQuestion(inversion=false){let sourceKey=pick(KEYS),sourceDegree=Math.floor(rng()*7),sourceRoot=majorScale(sourceKey)[sourceDegree],targetDegree=Math.floor(rng()*7),type=$('ctype').value;if(type==='random')type=pick(Object.keys(CHORDS));let resolvedKey=findKeyByDegree(sourceRoot,sourceDegree);if(!resolvedKey)throw Error('無法反推出和弦題的來源調性');let targetRoot=majorScale(resolvedKey)[targetDegree],base=buildChord(targetRoot,type);let prompt=`已知某調的${DEGREE[sourceDegree]}和弦根音為 ${sourceRoot.name}，求該調${DEGREE[targetDegree]}上的${CHORDS[type].name}`;if(!inversion)return{kind:'chord',answer:base,question:`${prompt}為 ____。（用音名表示；依根音至最高音輸入）`};let inv=Math.floor(rng()*base.length);return{kind:'inversion',answer:base.slice(inv).concat(base.slice(0,inv)),question:`${prompt}之${['原位','第一轉位','第二轉位','第三轉位'][inv]||`${inv}轉位`}為 ____。（用音名表示；依低音至高音輸入）`}}
function makeQuestion(){let p=$('paper').value;if(p==='degree')return makeDegreeQuestion();if(p==='chromatic')return makeChromaticQuestion();return makeChordQuestion(p==='inversion')}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setupEntry(index,count){let host=$(`entry-${index}`);host.dataset.answer='[]';let letters='<option value="">字母</option>'+LETTERS.map(x=>`<option value="${x}">${x}</option>`).join('');host.innerHTML=`<div class="entry"><select class="letter" aria-label="音名字母">${letters}</select><select class="acc" aria-label="升降記號"><option value="">自然音</option><option value="#">升 ♯</option><option value="b">降 ♭</option><option value="##">重升 𝄪</option><option value="bb">重降 𝄫</option></select><button type="button" class="secondary add">加入音符</button><button type="button" class="secondary undo">刪除末音</button><span class="preview">尚未輸入</span></div><small>已輸入 <span class="number">0</span>/${count} 音</small>`;let preview=host.querySelector('.preview'),number=host.querySelector('.number');host.querySelector('.add').onclick=()=>{let letter=host.querySelector('.letter').value,acc=host.querySelector('.acc').value;if(!letter){preview.textContent='請先選音名字母';return}let a=JSON.parse(host.dataset.answer);if(a.length>=count){preview.textContent=`此題需要 ${count} 個音，已達上限`;return}a.push(letter+acc);host.dataset.answer=JSON.stringify(a);preview.textContent=a.join(' – ');number.textContent=a.length};host.querySelector('.undo').onclick=()=>{let a=JSON.parse(host.dataset.answer);a.pop();host.dataset.answer=JSON.stringify(a);preview.textContent=a.length?a.join(' – '):'尚未輸入';number.textContent=a.length}}
function renderQuestions(){$('questions').innerHTML=questions.map((q,i)=>`<div class="question" id="question-${i}"><div>${i+1}. ${escapeHTML(q.question)}</div><div id="entry-${i}"></div><div class="feedback" id="feedback-${i}"></div></div>`).join('');questions.forEach((q,i)=>setupEntry(i,q.answer.length))}
function updateStats(){$('stats').innerHTML=`<span>題數 ${questions.length}</span><span>首次答對 ${statsData.first}</span><span>完成 ${statsData.done}/${questions.length}</span><span>答錯提交 ${statsData.wrong}</span><span>首次答對率 ${questions.length?Math.round(statsData.first/questions.length*100):0}%</span>`}
function renderWrongBook(){$('review').innerHTML=wrongBook.length?wrongBook.map((x,i)=>`<div class="review-item"><small>${escapeHTML(x.date)}</small><div>${escapeHTML(x.question)}</div><div>作答：<span class="bad">${escapeHTML(x.user)}</span>；正解：<span class="good">${escapeHTML(x.answer)}</span></div><button class="secondary" onclick="removeWrong(${i})">移除</button></div>`).join(''):'<p class="hint">目前沒有錯題。</p>'}function saveWrongBook(){localStorage.setItem('theoryWrongBook',JSON.stringify(wrongBook));renderWrongBook()}function removeWrong(i){wrongBook.splice(i,1);saveWrongBook()}
function revealAnswers(){if(!questions.length)return false;questions.forEach((q,i)=>{if(q.completed||q.revealed)return;q.revealed=true;let host=$(`entry-${i}`);host.querySelector('.preview').textContent=q.answer.map(n=>n.name).join(' – ');host.querySelectorAll('button,select').forEach(x=>x.disabled=true);$(`feedback-${i}`).innerHTML=`<span class="good">正確答案：${q.answer.map(n=>n.name).join(' – ')}</span>`});$('result').textContent='彩蛋：本回合尚未完成題目的答案已顯示。';return true}
function grade(){questions.forEach((q,i)=>{if(q.completed||q.revealed)return;let host=$(`entry-${i}`),raw=JSON.parse(host.dataset.answer);if(!raw.length){$(`question-${i}`).className='question wrong';$(`feedback-${i}`).textContent='請先輸入答案。';return}q.attempts=(q.attempts||0)+1;let parsed=raw.map(parseNote),isCorrect=sameNotes(parsed,q.answer),card=$(`question-${i}`),feedback=$(`feedback-${i}`);if(isCorrect){q.completed=true;statsData.done++;if(q.attempts===1)statsData.first++;card.className='question correct';host.querySelectorAll('button,select').forEach(x=>x.disabled=true);feedback.innerHTML='<span class="good">答對。</span>'}else{statsData.wrong++;wrongBook.unshift({date:new Date().toLocaleString('zh-TW'),question:q.question,user:raw.join(' – '),answer:q.answer.map(n=>n.name).join(' – ')});wrongBook=wrongBook.slice(0,300);saveWrongBook();card.className='question wrong';if(q.attempts>=3){q.completed=true;statsData.done++;q.revealed=true;host.querySelectorAll('button,select').forEach(x=>x.disabled=true);host.querySelector('.preview').textContent=q.answer.map(n=>n.name).join(' – ');feedback.innerHTML=`<span class="bad">三次答錯；正確答案：${q.answer.map(n=>n.name).join(' – ')}</span>`}else{host.dataset.answer='[]';host.querySelector('.preview').textContent='尚未輸入';host.querySelector('.number').textContent='0';feedback.innerHTML=`<span class="bad">不正確，剩餘 ${3-q.attempts} 次。</span>`}}});updateStats();$('submit').disabled=statsData.done===questions.length;$('result').textContent=`已完成 ${statsData.done}/${questions.length} 題；錯誤作答已加入錯題本。`}
function printableHTML(dateStr){if(!questions.length){$('result').textContent='請先產生試卷。';return null}let title=$('paper').selectedOptions[0].textContent,datePart=dateStr||'____________',seedPart=currentSeed!==null?String(currentSeed):'—';return `<article class="paper-page"><h1>韶韻音樂學院 馬老師 專為 秀玲設計 樂理亂數題庫</h1><div class="paper-meta">題型：${escapeHTML(title)}　姓名：________________　日期：${escapeHTML(datePart)}　分數：________　種子：${escapeHTML(seedPart)}<br>請依題意填寫音名。<span style="color:#c00;font-weight:700;text-decoration:underline;margin-left:18px">※請勿使用ChatGPT作答！</span><span style="color:#c00;font-weight:700;text-decoration:underline;margin-left:18px">※重現試卷須三者一致：種子＋題型＋題數</span></div>${questions.map((q,i)=>`<div class="paper-q"><b>${i+1}.</b> ${escapeHTML(q.question)}<div class="line"></div></div>`).join('')}<div class="paper-footer">樂理練習試卷</div></article>`}
function syncMode(){let p=$('paper').value;$('chromWrap').hidden=p!=='chromatic';$('ctypeWrap').hidden=!(p==='chord'||p==='inversion')}
let isDark=localStorage.getItem('theoryTheme')==='dark';function applyTheme(){$('html');document.documentElement.dataset.theme=isDark?'dark':'light';$('theme').textContent=isDark?'切換淺色系':'切換深色系'}applyTheme();$('theme').onclick=()=>{isDark=!isDark;localStorage.setItem('theoryTheme',isDark?'dark':'light');applyTheme()};$('title').addEventListener('click',e=>{if(e.target===e.currentTarget)revealAnswers()});
$('paper').onchange=syncMode;$('new').onclick=()=>{let count=Number($('count').value);if(!Number.isInteger(count)||count<1||count>100){$('result').textContent='題數需為 1 至 100 的整數。';return}let sv=$('seedVal').value.trim(),seed=sv!==''&&!isNaN(Number(sv))?Math.round(Number(sv)):Math.floor(Math.random()*1e7);currentSeed=seed;$('seedVal').value=seed;rng=mulberry32(seed);try{questions=Array.from({length:count},makeQuestion)}catch(e){$('result').textContent='產題失敗：'+e.message;return}statsData={first:0,done:0,wrong:0};$('result').textContent='';let sd=$('seedDisplay');sd.style.display='block';sd.innerHTML=`&#127807; <b>種子：${seed}</b>&ensp;｜&ensp;題型：${escapeHTML($('paper').selectedOptions[0].textContent)}&ensp;｜&ensp;題數：${count}<br><small style="color:var(--muted)">下次填入相同種子＋相同題型＋相同題數，即可重現此試卷。</small>`;renderQuestions();updateStats();$('submit').disabled=false};$('submit').onclick=grade;$('clear').onclick=()=>{if(confirm('確定清除錯題本？')){wrongBook=[];saveWrongBook()}};
function mountExport(){let area=$('printArea'),y=$('dateY').value.trim(),m=$('dateM').value.trim(),d=$('dateD').value.trim(),dateStr=(y||m||d)?(y+'年'+m+'月'+d+'日'):null;area.innerHTML=printableHTML(dateStr)||'';if(!area.firstElementChild)return null;area.hidden=false;return area.firstElementChild}function unmountExport(){let area=$('printArea');area.hidden=true;area.innerHTML=''}
$('printBtn').onclick=()=>{if(!mountExport())return;window.print();setTimeout(unmountExport,1000)};
$('imageBtn').onclick=async()=>{let page=mountExport();if(!page)return;try{if(!window.html2canvas)await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=resolve;s.onerror=()=>reject(Error('無法載入 PNG 輸出元件，請檢查網路連線。'));document.head.appendChild(s)});if(document.fonts?.ready)await document.fonts.ready;const width=1200,sourceWidth=page.getBoundingClientRect().width,sourceHeight=page.scrollHeight,scale=width/sourceWidth;let canvas=await html2canvas(page,{scale:2,backgroundColor:'#ffffff',width:sourceWidth,height:sourceHeight,windowWidth:sourceWidth,scrollX:0,scrollY:0});let anchor=document.createElement('a');anchor.download='韶韻音樂學院_樂理題庫.png';anchor.href=canvas.toDataURL('image/png');anchor.click()}catch(e){$('result').textContent=e.message||'圖檔輸出失敗。'}finally{unmountExport()}};
syncMode();updateStats();renderWrongBook();
</script></body></html>
